<!DOCTYPE html>
<html>

<head>

    <title>Update Patient</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5" style="max-width: 800px;">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            Update Patient Record
        </h2>

        <form method="POST">

            <div class="mb-3">

                <label>Full Name</label>

                <input type="text"
                       name="name"
                       value="{{ patient.name }}"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label>Date of Birth</label>

                <input type="date"
                       name="dob"
                       value="{{ patient.dob }}"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label>Email Address</label>

                <input type="email"
                       name="email"
                       value="{{ patient.email }}"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label>Glucose</label>

                <input type="number"
                       name="glucose"
                       value="{{ patient.glucose }}"
                       class="form-control"
                       min="0"
                       required>

            </div>

            <div class="mb-3">

                <label>Haemoglobin</label>

                <input type="number"
                       name="haemoglobin"
                       value="{{ patient.haemoglobin }}"
                       class="form-control"
                       min="0"
                       required>

            </div>

            <div class="mb-3">

                <label>Cholesterol</label>

                <input type="number"
                       name="cholesterol"
                       value="{{ patient.cholesterol }}"
                       class="form-control"
                       min="0"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-success w-100">

                Update Record

            </button>

        </form>

    </div>

</div>

</body>
</html>
